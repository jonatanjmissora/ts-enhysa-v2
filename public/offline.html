<!DOCTYPE html>
<html lang="es" class="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sin conexión — Enhysa</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: system-ui, -apple-system, sans-serif;
			background: #09090b;
			color: #fafafa;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 1rem;
		}
		.container {
			text-align: center;
			max-width: 320px;
		}
		.icon {
			width: 64px;
			height: 64px;
			margin: 0 auto 1.5rem;
			opacity: 0.5;
		}
		h1 {
			font-size: 1.25rem;
			font-weight: 600;
			margin-bottom: 0.5rem;
		}
		p {
			font-size: 0.875rem;
			color: #a1a1aa;
			margin-bottom: 1.5rem;
			line-height: 1.5;
		}
		a {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			background: #d97706;
			color: white;
			padding: 0.625rem 1.25rem;
			border-radius: 0.5rem;
			font-size: 0.875rem;
			font-weight: 500;
			text-decoration: none;
			transition: background 0.15s;
		}
		a:hover { background: #b45309; }
	</style>
</head>
<body>
	<div class="container">
		<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
			<path d="m4.93 4.93 4.24 4.24"/>
			<path d="m14.83 9.17 4.24-4.24"/>
			<path d="m14.83 14.83 4.24 4.24"/>
			<path d="m9.17 14.83-4.24 4.24"/>
			<line x1="2" y1="2" x2="22" y2="22"/>
		</svg>
		<h1>Sin conexión a internet</h1>
		<p>Esta página no está guardada en tu dispositivo. Conéctate a internet e intenta de nuevo.</p>
		<a href="/">
			<svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<path d="m15 18-6-6 6-6"/>
			</svg>
			Volver al inicio
		</a>
	</div>
</body>
</html>
